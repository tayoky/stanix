name: Build

on:
  push:
    branches:
      - main
      - dev
  # TODO : run on pull requests ??

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install build tools
      run: sudo apt update && sudo apt install gettext libgmp-dev libmpc-dev libmpfr-dev bison flex texinfo nasm xorriso mtools -y
    
    - name: Calculate toolchain hash
      id: toolchain-hash

      run: |
        HASH="$(./tinx.sh --build-package get-hash stanix-toolchain)"
        echo "hash=$HASH" >> "$GITHUB_OUTPUT"
    
    - name: Restore toolchain cache
      id: toolchain-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ./build/build-packages/*/.tinx-*
          ./build/build-env
          ./build/tinx-cache
        key: ${{ runner.os }}-toolchain-${{ steps.toolchain-hash.outputs.hash }}

    - name: Build toolchain
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      run: ./tinx.sh --build-package install stanix-toolchain

    - name: Save toolchain cache
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ./build/build-packages/*/.tinx-*
          ./build/build-env
          ./build/tinx-cache
        key: ${{ runner.os }}-toolchain-${{ steps.toolchain-hash.outputs.hash }}

    - name: Restore tinx cache
      id: tinx-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ./build/host-packages/*/.tinx-*
          ./build/tinx-cache
        key: tinx-cache-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          tinx-cache-${{ github.ref_name }}-

    - name: Select packages
      id: select-packages
      run: |
        READY_PACKAGES="$(./tinx.sh run scripts/get-ready-host-packages.sh stanix-base)"
        echo "ready=$READY_PACKAGES" >> "$GITHUB_OUTPUT"
        DIRTY_PACKAGES="$(./tinx.sh run scripts/get-dirty-host-packages.sh stanix-base)"
        echo "dirty=$DIRTY_PACKAGES" >> "$GITHUB_OUTPUT"

    - name: Select packages repo
      run: |
        if test "${{ github.ref_name }}" = "main" ; then
          echo "REPO_RELEASE=stable" >> "$GITHUB_ENV"
        elif test "${{ github.ref_name }}" = "dev" ; then
          echo "REPO_RELEASE=nightly" >> "$GITHUB_ENV"
        fi

    - name: Download ready packages
      run: ./tinx.sh run scripts/download-packages.sh ${{ steps.select-packages.outputs.ready }}

    - name: Build
      run: ./tinx.sh install stanix-base

    - name: Save tinx cache
      if: github.event_name == 'push'
      uses: actions/cache/save@v4
      with:
        path: |
          ./build/host-packages/*/.tinx-*
          ./build/tinx-cache
        key: tinx-cache-${{ github.ref_name }}-${{ github.sha }}

    - name: Make iso image
      run: ./tinx.sh run scripts/build-iso-image.sh

    - name: Upload iso image
      uses: actions/upload-artifact@v4
      with:
        name: iso-image
        path: build/images/stanix.iso

    - name: Upload packages to repo
      if: github.event_name == 'push' && env.REPO_RELEASE != ''
      env:
        GH_TOKEN: ${{ secrets.PACKAGES_REPO_TOKEN }}
      run: ./tinx.sh run scripts/upload-packages.sh ${{ steps.select-packages.outputs.dirty }}
